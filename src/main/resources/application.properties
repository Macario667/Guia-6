# Nivel raíz de logging
quarkus.log.level=INFO

# Formato de consola (incluye MDC request.id)
quarkus.log.console.format=%d{HH:mm:ss} %-5p request.id=%X{request.id} [%c{2.}] (%t) %s%e%n

# Filtro de consola: descarta mensajes DIAGNOSTICO_INTERNO
quarkus.log.console.filter=filtro-consola

# Desactivar JSON en consola (quarkus-logging-json lo habilita por defecto)
quarkus.log.console.json.enabled=false

# Handler de archivo exclusivo para eventos de la aplicación
quarkus.log.handler.file.EVENTOS.enabled=true
quarkus.log.handler.file.EVENTOS.path=logs/eventos.log
quarkus.log.handler.file.EVENTOS.level=INFO

# Rotar cuando el archivo alcance aproximadamente 10 MB
quarkus.log.handler.file.EVENTOS.rotation.max-file-size=10M

# Conservar hasta 5 archivos de respaldo (retención)
quarkus.log.handler.file.EVENTOS.rotation.max-backup-index=5

# Rotar también al arrancar la aplicación
quarkus.log.handler.file.EVENTOS.rotation.rotate-on-boot=true

# El handler de archivo mantiene el MDC (request.id) en formato JSON,
# por eso el detalle de cada línea queda siempre correlacionable.

# La categoría de nuestra app usa el handler EVENTOS y también
# se propaga a consola (para que el filtro y request.id funcionen)
quarkus.log.category."com.inklusport".handlers=EVENTOS
quarkus.log.category."com.inklusport".level=INFO

# Perfil de desarrollo: sí queremos DEBUG para diagnosticar
%dev.quarkus.log.category."com.inklusport".level=DEBUG

# Perfil de producción: INFO evita inundar los logs
%prod.quarkus.log.category."com.inklusport".level=INFO

quarkus.application.name=eventos-service
quarkus.otel.logs.enabled=false
quarkus.otel.exporter.otlp.logs.endpoint=http://localhost:4317
