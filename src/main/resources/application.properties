quarkus.log.level=INFO
quarkus.log.category."com.inklusport".level=DEBUG
quarkus.log.category."io.quarkus".level=INFO


# Guardar logs en un archivo
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/eventos-service.log

# Registrar INFO y niveles más graves en el archivo
quarkus.log.file.level=INFO

# Rotar cuando el archivo alcance aproximadamente 10 MB
quarkus.log.file.rotation.max-file-size=10M

# Conservar hasta 5 archivos de respaldo
quarkus.log.file.rotation.max-backup-index=5

# Formato JSON para la salida de consola
quarkus.log.console.json.enabled=true

# No embellecer el JSON: mantener un registro por línea
quarkus.log.console.json.pretty-print=false

# Configuración común
quarkus.log.level=INFO

# Perfil de desarrollo
%dev.quarkus.log.category."com.inklusport".level=DEBUG

# Perfil de producción
%prod.quarkus.log.category."com.inklusport".level=INFO
